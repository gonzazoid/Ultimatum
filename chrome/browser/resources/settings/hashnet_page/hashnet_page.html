<settings-section page-title="" section="hashnet" id="hashNetSection" >
  <div>HASHNET!!!</div>
  <div>И так будет с каждым!!!</div>
<settings-toggle-button 
  id="hashNetOnTestToggle"
  label="test"
  pref="{{prefs.settings.a11y.focus_highlight}}">
</settings-toggle-button>
<settings-toggle-button 
  id="hashNetOnToggle"
  label="on/off"
  pref="{{prefs.settings.hashnet.on}}">
</settings-toggle-button>
    <!-- Max length of 100 KB to prevent browser from freezing. -->
    <settings-textarea id="input" value="{{value}}" rows=16 autogrow="true"
        placeholder="$i18n{secureDnsCustomPlaceholder}" invalid="[[showError_]]"
        first-footer="[[errorText_]]" maxlength="102400" spellcheck="false"
        on-keypress="onKeyPress_" on-input="onInput_"
        on-blur="validate" on-change="validate">
    </settings-textarea>
    <cr-button id="saveButton" role="button" on-click="onSaveButtonClick_"
        class$="[[computeBackButtonClass_(privacyGuideStep_)]]">
      save
    </cr-button>
</settings-section>
